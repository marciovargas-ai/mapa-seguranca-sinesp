nas vermelhas. Clique em qualquer coisa para ver o detalhe.\"},{alvo:\".botao-mapa\",titulo:\"Camadas do mapa\",texto:\"Liga e desliga camadas: bairros, calor, zonas vermelhas, tiroteios do Instituto Fogo Cruzado, trechos de rodovia com mais acidentes (PRF, com BR e km), Unidades Shopee e, no RJ, as \\xE1reas de delegacia com dados oficiais do ISP.\"},{alvo:\".legenda\",titulo:\"Legenda\",texto:\"Mostra quantas not\\xEDcias h\\xE1 no per\\xEDodo, quantas t\\xEAm local exato, as cores de cada tipo de crime e a lista das not\\xEDcias sem bairro identificado.\"},{alvo:\".abas .mat-mdc-tab-header\",topoAbas:!0,titulo:\"Abas\",texto:\"Panorama junta todas as fontes; Dados oficiais detalha o Sinesp ano a ano; Estado compara os munic\\xEDpios; Zonas lista as \\xE1reas mais violentas; Fac\\xE7\\xF5es mostra disputas entre grupos; Not\\xEDcias traz cada ocorr\\xEAncia com link.\"},{alvo:\".cartao.parecer\",aba:\"PANORAMA\",titulo:\"Parecer\",texto:\"Resumo em texto escrito automaticamente a partir dos dados: quantas mortes, a tend\\xEAncia, a propor\\xE7\\xE3o (1 morte a cada N habitantes) comparada ao estado e os bairros mais citados.\"},{alvo:\".cartao.risco\",aba:\"PANORAMA\",titulo:\"\\xCDndice de criminalidade\",texto:'De 0 a 100, comparando a cidade com os munic\\xEDpios do Brasil: mortes violentas, roubos (onde o estado publica), tentativas de homic\\xEDdio e tend\\xEAncia, sempre em propor\\xE7\\xE3o \\xE0 popula\\xE7\\xE3o. Com menos de 10 mortes no per\\xEDodo, n\\xE3o h\\xE1 nota (poucos casos) e o cart\\xE3o explica o porqu\\xEA; de 10 a 19, a nota vem com a faixa prov\\xE1vel. Abra \"Ver os n\\xFAmeros de cada parte\" para conferir.'},{alvo:\".cartao.mes-a-mes\",aba:\"PANORAMA\",titulo:\"M\\xEAs a m\\xEAs\",texto:\"Barras: mortes violentas por m\\xEAs no Sinesp (as vermelhas s\\xE3o os meses do per\\xEDodo escolhido). Linha: not\\xEDcias do mesmo m\\xEAs, como complemento. Ajuda a ver se a cidade est\\xE1 melhorando ou piorando.\"},{alvo:\".cartao.trafico\",aba:
