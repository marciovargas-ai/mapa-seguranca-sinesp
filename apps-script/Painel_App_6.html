s entre grupos armados do Instituto Fogo Cruzado.\"},{alvo:\".cartao.por-bairro\",aba:\"PANORAMA\",titulo:\"Ocorr\\xEAncias por bairro\",texto:\"Os bairros com mais ocorr\\xEAncias noticiadas no per\\xEDodo, quantas s\\xE3o graves, quantas foram nos \\xFAltimos 30 dias e o tipo de crime mais comum. Clique num bairro para v\\xEA-lo no mapa.\"},{alvo:\".abas\",aba:\"OFICIAL\",topoAbas:!0,titulo:\"Dados oficiais\",texto:\"Cada indicador do Sinesp ano a ano (2024 em diante), com o gr\\xE1fico m\\xEAs a m\\xEAs e o que cada \\xF3rg\\xE3o de seguran\\xE7a registrou nos \\xFAltimos 12 meses.\"},{alvo:\".abas\",aba:\"ESTADO\",topoAbas:!0,titulo:\"Estado\",texto:\"Panorama do estado inteiro: totais, tend\\xEAncia, insights e a lista de munic\\xEDpios ordenada pela taxa de mortes violentas, para comparar a cidade com as vizinhas.\"},{alvo:\".abas\",aba:\"ZONAS\",topoAbas:!0,titulo:\"Zonas vermelhas\",texto:\"As \\xE1reas onde as ocorr\\xEAncias graves e recentes se concentram, com \\xEDndice (100 = a mais intensa), tend\\xEAncia dos \\xFAltimos 30 dias e bot\\xE3o para ver no mapa. Com a camada de Unidades Shopee ligada, mostra tamb\\xE9m as ocorr\\xEAncias num raio de 3 km de cada unidade.\"},{alvo:\".abas\",aba:\"FACCOES\",topoAbas:!0,titulo:\"Fac\\xE7\\xF5es e disputas\",texto:\"Bairros com mais sinais de atua\\xE7\\xE3o de fac\\xE7\\xF5es: tiroteios em disputa entre grupos armados (Instituto Fogo Cruzado, em Rio, Recife, Salvador e Bel\\xE9m), not\\xEDcias que citam fac\\xE7\\xE3o ou tr\\xE1fico e registros oficiais de tr\\xE1fico. S\\xF3 entra o que foi registrado, com a fonte.\"},{alvo:\".abas\",aba:\"NOTICIAS\",topoAbas:!0,titulo:\"Not\\xEDcias\",texto:\"An\\xE1lise das not\\xEDcias (por m\\xEAs, tipo, dia da semana, locais e ve\\xEDculos) e cada not\\xEDcia com ve\\xEDculo, data, bairro e \\xF3rg\\xE3os citados. Not\\xEDcias s\\xE3o complemento: servem para localizar e acompanhar, n\\xE3o substituem a estat\\xEDstica oficial.\"},{alvo:\".botao-favoritos\",titulo:\"Favoritos\",texto:\"A estrela ao lado do nome da cidade salva o local; este bot\\xE3o lista os favoritos para abrir com um clique.\"},{alvo:\".bt-alertas\",titulo:\"Alertas por e-mail\",texto:\"Escolha cidades e temas para receber um e-mail quando surgirem ocorr\\xEAncias novas ou avisos do INMET.\"},{alvo:\".bt-relatos\",titulo:\"Relatos das equipes\",texto:\"As equipes da Shopee registram aqui o que a opera\\xE7\\xE3o viveu no local (assalto, roubo de carga, \\xE1rea de risco). S\\xF3 contas @shopee.com veem os relatos.\"},{alvo:\".sino\",titulo:\"Shopee nas not\\xEDcias\",texto:\"O sino avisa quando sai not\\xEDcia envolvendo a Shopee (motoristas, cargas, unidades). O n\\xFAmero mostra quantas ainda n\\xE3o foram lidas.\"},{alvo:\".bt-fontes\",titulo:\"Sa\\xFAde das fontes\",texto:\"At\\xE9 quando vale cada n\\xFAmero do painel: verde est\\xE1 atualizado no prazo, amarelo est\\xE1 atrasado. Mostra tamb\\xE9m o grau de confian\\xE7a de cada fonte.\"},{alvo:\"app-agente .fab\",titulo:\"Assistente IA\",texto:\"Pergunte qualquer coisa sobre os dados na tela. Cada resposta pode ser exportada em PDF ou Google Sheets.\"},{alvo:\".bt-ajuda\",titulo:\"Rever o tour\",texto:\"Este bot\\xE3o abre o tour de novo quando quiser. Ao lado ficam o tema claro ou escuro e o idioma (portugu\\xEAs ou ingl\\xEAs).\"}],Sp=class t{store=g(Ye);fechar=mw();i=O(0);passo=F(()=>zl[this.i()]);tick=O(0);elBalao=bn(\"caixaBalao\");timers=[];observador;existentes=F(()=>(this.tick(),zl.map((n,e)=>e===this.i()||!!n.aba||!!cy(n.alvo))));total=F(()=>this.existentes().filter(Boolean).length);numero=F(()=>this.existentes().slice(0,this.i()+1).filter(Boolean).length);caixa=F(()=>{this.tick();let n=cy(this.passo().alvo);if(!n)return{top:window.innerHeight/2,left:window.innerWidth/2,width:0,height:0};let e=6,i=wF(n),o=Math.max(4,i.top-e),a=Math.max(4,i.left-e),r=Math.min(window.innerHeight-4,i.bottom+e),s=Math.min(window.innerWidth-4,i.right+e);return{top:o,left:a,width:Math.max(0,s-a),height:Math.max(0,r-o)
