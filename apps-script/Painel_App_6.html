 muda para o local escolhido: mapa, n\\xFAmeros, abas e not\\xEDcias.\"},{alvo:\".kpis\",titulo:\"N\\xFAmeros oficiais\",texto:'Os cart\\xF5es do topo v\\xEAm do Sinesp (Minist\\xE9rio da Justi\\xE7a). \"Mortes violentas\" soma homic\\xEDdio doloso, feminic\\xEDdio, latroc\\xEDnio e les\\xE3o corporal seguida de morte. A seta compara o per\\xEDodo escolhido com os mesmos meses do ano anterior.'},{alvo:\".faixa-inmet\",titulo:\"Avisos do INMET\",texto:\"Quando h\\xE1 aviso meteorol\\xF3gico para o local (tempestade, chuva forte, ventania), ele aparece nesta faixa com o grau de perigo e a validade. Clique para abrir o aviso no site do INMET.\"},{alvo:\".filtros\",titulo:\"Per\\xEDodo e tipo de crime\",texto:\"O per\\xEDodo (30 dias a 12 meses) e o tipo de crime valem para todas as abas, para o mapa e para os cart\\xF5es. No Sinesp, que \\xE9 mensal, o per\\xEDodo vira os \\xFAltimos meses publicados. Daqui para baixo, o painel rola e os cart\\xF5es do topo ficam fixos.\"},{alvo:\".area-mapa\",titulo:\"Mapa\",texto:\"Cada bairro \\xE9 pintado pela quantidade de ocorr\\xEAncias noticiadas (contorno do IBGE ou do OpenStreetMap). Pontos s\\xE3o locais exatos; c\\xEDrculos vermelhos numerados s\\xE3o zonas vermelhas. Clique em qualquer coisa para ver o detalhe.\"},{alvo:\".botao-mapa\",titulo:\"Camadas do mapa\",texto:\"Liga e desliga camadas: bairros, calor, zonas vermelhas, tiroteios do Instituto Fogo Cruzado, trechos de rodovia com mais acidentes (PRF, com BR e km), Unidades Shopee e, no RJ, as \\xE1reas de delegacia com dados oficiais do ISP.\"},{alvo:\".legenda\",titulo:\"Legenda\",texto:\"Mostra quantas not\\xEDcias h\\xE1 no per\\xEDodo, quantas t\\xEAm local exato, as cores de cada tipo de crime e a lista das not\\xEDcias sem bairro identificado.\"},{alvo:\".abas .mat-mdc-tab-header\",topoAbas:!0,titulo:\"Abas\",texto:\"Panorama junta todas as fontes; Dados oficiais detalha o Sinesp ano a ano; Estado compara os munic\\xEDpios; Zonas lista as \\xE1reas mais violentas; Fac\\xE7\\xF5es mostra disputas entre grupos; Not\\xEDcias traz cada ocorr\\xEAncia com link.\"},{alvo:\".cartao.parecer\",aba:\"PANORAMA\",titulo:\"Parecer\",texto:\"Resumo em texto escrito automaticamente a partir dos dados: quantas mortes, a tend\\xEAncia, a propor\\xE7\\xE3o (1 morte a cada N habitantes) comparada ao estado e os bairros mais citados.\"},{alvo:\".cartao.risco\",aba:\"PANORAMA\",titulo:\"\\xCDndice de criminalidade\",texto:'De 0 a 100, comparando a cidade com os munic\\xEDpios do Brasil: mortes violentas, roubos (onde o estado publica), tentativas de homic\\xEDdio e tend\\xEAncia, sempre em propor\\xE7\\xE3o \\xE0 popula\\xE7\\xE3o. Com menos de 10 mortes no per\\xEDodo, n\\xE3o h\\xE1 nota (poucos casos) e o cart\\xE3o explica o porqu\\xEA; de 10 a 19, a nota vem com a faixa prov\\xE1vel. Abra \"Ver os n\\xFAmeros de cada parte\" para conferir.'},{alvo:\".cartao.mes-a-mes\",aba:\"PANORAMA\",titulo:\"M\\xEAs a m\\xEAs\",texto:\"Barras: mortes violentas por m\\xEAs no Sinesp (as vermelhas s\\xE3o os meses do per\\xEDodo escolhido). Linha: not\\xEDcias do mesmo m\\xEAs, como complemento. Ajuda a ver se a cidade est\\xE1 melhorando ou piorando.\"},{alvo:\".cartao.trafico\",aba:\"PANORAMA\",titulo:\"Tr\\xE1fico e fac\\xE7\\xF5es\",texto:\"Not\\xEDcias de tr\\xE1fico e de fac\\xE7\\xF5es ou mil\\xEDcias citadas, o tr\\xE1fico no estado (o Sinesp n\\xE3o publica por cidade), apreens\\xF5es do ISP no RJ e disputas entre grupos armados do Instituto Fogo Cruzado.\"},{alvo:\".cartao.por-bairro\",aba:\"PANORAMA\",titulo:\"Ocorr\\xEAncias por bairro\",texto:\"Os bairros com mais ocorr\\xEAncias noticiadas no per\\xEDodo, quantas s\\xE3o graves, quantas foram nos \\xFAltimos 30 dias e o tipo de crime mais comum. Clique num bairro para v\\xEA-lo no mapa.\"},{alvo:\".abas\",aba:\"OFICIAL\",topoAbas:!0,titulo:\"Dados oficiais\",texto:\"Cada indicador do Sinesp ano a ano (2024 em diante), com o gr\\xE1fico m\\xEAs a m\\xEAs e o que cada \\xF3rg\\xE3o de seguran\\xE7a registrou nos \\xFAltimos 12 meses.\"},{alvo:\".abas\",aba:\"ESTADO\",topoAbas:!0,titulo:\"Estado\",texto:\"Panorama do estado inteiro: totais, tend\\xEAncia, insights e a lista de munic\\xEDpios ordenada pela propor\\xE7\\xE3o de mortes violentas, para comparar a cidade com as vizinhas.\"},{alvo:\".abas\",aba:\"ZONAS\",topoAbas:!0,titulo:\"Zonas vermelhas\",texto:\"As \\xE1reas onde as ocorr\\xEAncias graves e recentes se concentram, com \\xEDndice (100 = a mais intensa), tend\\xEAncia dos \\xFAltimos 30 dias e bot\\xE3o para ver no mapa. Com a camada de Unidades Shopee ligada, mostra tamb\\xE9m as ocorr\\xEAncias num raio de 3 km de cada unidade.\"},{alvo:\".abas\",aba:\"FACCOES\",topoAbas:!0,titulo:\"Fac\\xE7\\xF5es e disputas\",texto:\"Bairros com mais sinais de atua\\xE7\\xE3o de fac\\xE7\\xF5es: tiroteios em disputa entre grupos armados (Instituto Fogo Cruzado, em Rio, Recife, Salvador e Bel\\xE9m), not\\xEDcias que citam fac\\xE7\\xE3o ou tr\\xE1fico e registros oficiais de tr\\xE1fico. S\\xF3 entra o que foi registrado, com a fonte.\"},{alvo:\".abas\",aba:\"NOTICIAS\",topoAbas:!0,titulo:\"Not\\xEDcias\",texto:\"An\\xE1lise das not\\xEDcias (por m\\xEAs, tipo, dia da semana, locais e ve\\xEDculos) e cada not\\xEDcia com ve\\xEDculo, data, bairro e \\xF3rg\\xE3os citados. Not\\xEDcias s\\xE3o complemento: servem para localizar e acompanhar, n\\xE3o substituem a estat\\xEDstica oficial.\"},{alvo:\".botao-favoritos\",titulo:\"Favoritos\",texto:\"A estrela ao lado do nome da cidade salva o local; este bot\\xE3o lista os favoritos para abrir com um clique.\"},{alvo:\".bt-alertas\",titulo:\"Alertas por e-mail\",texto:\"Escolha cidades e temas para receber um e-mail quando surgirem ocorr\\xEAncias novas ou avisos do INMET.\"},{alvo:\".bt-relatos\",titulo:\"Relatos das equipes\",texto:\"As equipes da Shopee registram aqui o que a opera\\xE7\\xE3o viveu no local (assalto, roubo de carga, \\xE1rea de risco). S\\xF3 contas @shopee.com veem os relatos.\"},{alvo:\"
