ico no estado (o Sinesp n\\xE3o publica por cidade), apreens\\xF5es do ISP no RJ e disputas entre grupos armados do Instituto Fogo Cruzado.\"},{alvo:\".cartao.por-bairro\",aba:\"PANORAMA\",titulo:\"Ocorr\\xEAncias por bairro\",texto:\"Os bairros com mais ocorr\\xEAncias noticiadas no per\\xEDodo, quantas s\\xE3o graves, quantas foram nos \\xFAltimos 30 dias e o tipo de crime mais comum. Clique num bairro para v\\xEA-lo no mapa.\"},{alvo:\".abas\",aba:\"OFICIAL\",topoAbas:!0,titulo:\"Dados oficiais\",texto:\"Cada indicador do Sinesp ano a ano (2024 em diante), com o gr\\xE1fico m\\xEAs a m\\xEAs e o que cada \\xF3rg\\xE3o de seguran\\xE7a registrou nos \\xFAltimos 12 meses.\"},{alvo:\".abas\",aba:\"ESTADO\",topoAbas:!0,titulo:\"Estado\",texto:\"Panorama do estado inteiro: totais, tend\\xEAncia, insights e a lista de munic\\xEDpios ordenada pela taxa de mortes violentas, para comparar a cidade com as vizinhas.\"},{alvo:\".abas\",aba:\"ZONAS\",topoAbas:!0,titulo:\"Zonas vermelhas\",texto:\"As \\xE1reas onde as ocorr\\xEAncias graves e recentes se concentram, com \\xEDndice (100 = a mais intensa), tend\\xEAncia dos \\xFAltimos 30 dias e bot\\xE3o para ver no mapa. Com a camada de Unidades Shopee ligada, mostra tamb\\xE9m as ocorr\\xEAncias num raio de 3 km de cada unidade.\"},{alvo:\".abas\",aba:\"FACCOES\",topoAbas:!0,titulo:\"Fac\\xE7\\xF5es e disputas\",texto:\"Bairros com mais sinais de atua\\xE7\\xE3o de fac\\xE7\\xF5es: tiroteios em disputa entre grupos armados (Instituto Fogo Cruzado, em Rio, Recife, Salvador e Bel\\xE9m), not\\xEDcias que citam fac\\xE7\\xE3o ou tr\\xE1fico e registros oficiais de tr\\xE1fico. S\\xF3 entra o que foi registrado, com a fonte.\"},{alvo:\".abas\",aba:\"NOTICIAS\",topoAbas:!0,titulo:\"Not\\xEDcias\",texto:\"An\\xE1lise das not\\xEDcias (por m\\xEAs, tipo, dia da semana, locais e ve\\xEDculos) e cada not\\xEDcia com ve\\xEDculo, data, bairro e \\xF3rg\\xE3os citados. Not\\xEDcias s\\xE3o complemento: servem para localizar e acompanhar
