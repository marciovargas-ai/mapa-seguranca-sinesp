name: Atualizar Sinesp

on:
  schedule:
    - cron: '0 10 3,18 * *'   # dias 3 e 18 de cada mês, 07:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python scripts/atualizar_sinesp.py
      - name: Publicar resumo
        run: |
          git config user.name "robo-sinesp"
          git config user.email "robo-sinesp@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "Sinesp: atualização $(date -u +%Y-%m-%d)" && git push)
