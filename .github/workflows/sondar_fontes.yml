name: Sondar fontes oficiais estaduais
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script de sondagem'
        default: 'sondar_fontes.py'
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python -u scripts/${{ inputs.script || 'sondar_fontes.py' }}
