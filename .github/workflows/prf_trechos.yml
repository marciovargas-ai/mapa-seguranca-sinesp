name: Trechos críticos das rodovias federais (PRF)
on:
  schedule:
    - cron: '0 13 5 * *'   # dia 5 de cada mês, 10:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/prf_trechos.py
      - name: Publicar
        run: |
          git config user.name "robo-sinesp"
          git config user.email "robo-sinesp@users.noreply.github.com"
          git add dados/prf_trechos.json
          git diff --cached --quiet || (git commit -m "Trechos críticos PRF: $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
