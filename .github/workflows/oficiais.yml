name: Dados oficiais por bairro (secretarias estaduais)
on:
  schedule:
    - cron: '0 13 * * 2'   # toda terça, 10:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python -u scripts/oficiais_sp.py
      - name: Publicar
        run: |
          git config user.name "robo-sinesp"
          git config user.email "robo-sinesp@users.noreply.github.com"
          git add dados/oficial
          git diff --cached --quiet || (git commit -m "Dados oficiais por bairro: SP $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
