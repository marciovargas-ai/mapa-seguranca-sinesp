name: Roubos por município (RS e MG)
on:
  schedule:
    - cron: '0 12 * * 3'   # toda quarta, 09:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  roubos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python -u scripts/roubos_rs_mg.py
      - run: python scripts/roubos_municipais.py
      - name: Publicar
        run: |
          git config user.name "robo-sinesp"
          git config user.email "robo-sinesp@users.noreply.github.com"
          git add dados/roubos_rs_mg.json dados/roubos_municipios.json
          git diff --cached --quiet || (git commit -m "Roubos por município RS e MG: $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
